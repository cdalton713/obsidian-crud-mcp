# Fly.io app template. deploy/setup.sh runs `fly launch --copy-config` here,
# which fills in `app` and `primary_region`.
#
# Secrets (set by deploy/setup.sh, never in this file):
#   MCP_AUTH_TOKEN, VAULT_NAME, BASE_URL,
#   S3_ENDPOINT, S3_REGION, S3_BUCKET, S3_PREFIX, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY,
#   CF_ACCOUNT_ID, CF_AI_SEARCH_INSTANCE, CF_AI_SEARCH_TOKEN (optional, semantic search)

app = 'obsidian-crud-mcp'
primary_region = 'iad'

[build]

[env]
VAULT_PATH = '/data/vault'
DATA_DIR = '/data'

[[mounts]]
source = 'mcp_data'
destination = '/data'

[http_service]
internal_port = 8787
force_https = true
# A suspended machine does not poll the bucket; it catches up on the first poll after waking.
auto_stop_machines = 'suspend'
auto_start_machines = true
min_machines_running = 0

[[http_service.checks]]
interval = '30s'
timeout = '5s'
path = '/health'

# 512 MB: the mirror's search index and content cache outgrow 256 MB on large vaults.
[[vm]]
memory = '512mb'
cpu_kind = 'shared'
cpus = 1
