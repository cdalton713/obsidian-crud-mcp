# Keeps the SHA-pinned actions in .github/workflows, the Docker base images,
# and the Cargo dependencies up to date.
version: 2
updates:
    - package-ecosystem: github-actions
      directory: /
      schedule:
          interval: weekly
      groups:
          actions:
              patterns: ["*"]
    - package-ecosystem: cargo
      directory: /
      schedule:
          interval: weekly
      groups:
          minor-and-patch:
              update-types: ["minor", "patch"]
    - package-ecosystem: docker
      directories: ["/"]
      schedule:
          interval: weekly
