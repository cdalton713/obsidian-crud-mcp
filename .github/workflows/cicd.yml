name: CI/CD

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
        branches: [main]

# Read-only by default (this also covers pull_request runs); jobs that
# publish request only the scopes they need.
permissions:
    contents: read

jobs:
    # Static checks run once; they do not depend on the Node version.
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Reads the pnpm version from packageManager; must precede setup-node's pnpm cache.
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run lint
            - run: pnpm run format:check
            - run: pnpm run typecheck
            - run: pnpm audit --audit-level=high

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Reads the pnpm version from packageManager; must precede setup-node's pnpm cache.
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm pack
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: package
                  path: "*.tgz"

    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                node: ["22", "24"]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: ${{ matrix.node }}
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm test

    # E2E: start server in local mode, test all tools via MCP protocol
    test-e2e:
        runs-on: ubuntu-latest
        needs: build
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Reads the pnpm version from packageManager; must precede setup-node's pnpm cache.
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"
                  cache: pnpm
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            - run: pnpm run test:e2e

    # Docker: build the MCP image and the Fly image on top of it from this checkout
    test-docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: docker build -t obsidian-crud-mcp:ci .
            - run: docker build --build-arg MCP_IMAGE=obsidian-crud-mcp:ci -t obsidian-crud-mcp:ci-fly deploy/mcp-only

    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [check, build, test, test-e2e, test-docker]
        runs-on: ubuntu-latest
        permissions:
            contents: write # gh release create
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: package
            - name: Extract changelog
              if: ${{ !contains(github.ref_name, 'rc') }}
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  awk "/^## ${VERSION}/{found=1; next} /^## /{if(found) exit} found" CHANGELOG.md > release-notes.md
            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [[ "${{ github.ref_name }}" == *rc* ]]; then
                    gh release create "${{ github.ref_name }}" \
                      --title "${{ github.ref_name }}" \
                      --generate-notes \
                      --prerelease \
                      *.tgz
                  else
                    gh release create "${{ github.ref_name }}" \
                      --title "${{ github.ref_name }}" \
                      --notes-file release-notes.md \
                      *.tgz
                  fi

    publish-npm:
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc')
        needs: release
        runs-on: ubuntu-latest
        permissions:
            contents: read
            id-token: write # npm publish --provenance (OIDC)
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # Reads the pnpm version from packageManager; must precede setup-node's pnpm cache.
            - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version: "22"
                  cache: pnpm
                  registry-url: "https://registry.npmjs.org"
            - run: pnpm install --frozen-lockfile
            - run: pnpm run build
            # npm 11 provides the existing OIDC trusted-publishing flow.
            - run: pnpm dlx npm@11 publish --provenance --access public

    publish-docker:
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc')
        needs: release
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write # push to ghcr.io
            id-token: write # sign the provenance attestation
            attestations: write # store the attestation
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # The Dockerfile installs dependencies and builds dist/ itself.
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  platforms: linux/amd64,linux/arm64
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  tags: |
                      ghcr.io/${{ github.repository }}:${{ github.ref_name }}
                      ghcr.io/${{ github.repository }}:latest
            - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-name: ghcr.io/${{ github.repository }}
                  subject-digest: ${{ steps.build.outputs.digest }}
                  push-to-registry: true
