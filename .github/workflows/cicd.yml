name: CI/CD

on:
    push:
        branches: [main]
        tags: ["v*"]
    pull_request:
        branches: [main]

# Read-only by default; jobs that fix or publish request write access.
permissions:
    contents: read

env:
    CARGO_TERM_COLOR: always

jobs:
    # Static checks; rust-toolchain.toml pins the toolchain, which rustup installs on first use.
    check:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  ref: ${{ github.event.pull_request.head.sha || github.sha }}
            - run: cargo clippy --fix --allow-dirty --all-targets --locked
            - run: cargo fmt
            - run: cargo clippy --all-targets --locked -- -D warnings
            - name: Push lint and formatting fixes
              if: >-
                  (github.event_name == 'push' && github.ref_type == 'branch') ||
                  (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
              env:
                  TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
              run: |
                  if git diff --quiet; then
                    exit 0
                  fi
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add -u
                  git commit --no-verify -m "chore: apply lint and formatting fixes"
                  git push origin "HEAD:refs/heads/$TARGET_BRANCH"
            - name: Check fixes on forks and tags
              if: >-
                  github.ref_type == 'tag' ||
                  (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository)
              run: git diff --exit-code

    audit:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: cargo install cargo-audit --locked
            - run: cargo audit

    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: cargo build --release --locked
            - name: Package the binary
              run: |
                  VERSION="$(sed -nE 's/^version = "([^"]+)"$/\1/p' Cargo.toml | head -n 1)"
                  NAME="obsidian-crud-mcp-${VERSION}-x86_64-unknown-linux-gnu"
                  mkdir "$NAME"
                  cp target/release/obsidian-crud-mcp README.md LICENSE "$NAME/"
                  tar -czf "$NAME.tar.gz" "$NAME"
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: package
                  path: "*.tar.gz"

    test:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: cargo test --locked --lib --bins

    # E2E: start the server in local mode, test all tools via the MCP protocol
    test-e2e:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: cargo test --locked --test e2e

    # Docker: build the MCP image and the Fly image on top of it from this checkout
    test-docker:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - run: docker build -t obsidian-crud-mcp:ci .
            - run: docker build --build-arg MCP_IMAGE=obsidian-crud-mcp:ci -t obsidian-crud-mcp:ci-fly deploy/mcp-only

    release:
        if: startsWith(github.ref, 'refs/tags/v')
        needs: [check, audit, build, test, test-e2e, test-docker]
        runs-on: ubuntu-latest
        permissions:
            contents: write # gh release create
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              with:
                  name: package
            - name: Extract changelog
              if: ${{ !contains(github.ref_name, 'rc') }}
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  awk "/^## ${VERSION}/{found=1; next} /^## /{if(found) exit} found" CHANGELOG.md > release-notes.md
            - name: Create GitHub Release
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if [[ "${{ github.ref_name }}" == *rc* ]]; then
                    gh release create "${{ github.ref_name }}" \
                      --title "${{ github.ref_name }}" \
                      --generate-notes \
                      --prerelease \
                      *.tar.gz
                  else
                    gh release create "${{ github.ref_name }}" \
                      --title "${{ github.ref_name }}" \
                      --notes-file release-notes.md \
                      *.tar.gz
                  fi

    publish-docker:
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc')
        needs: release
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write # push to ghcr.io
            id-token: write # sign the provenance attestation
            attestations: write # store the attestation
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            # The Dockerfile compiles the binary itself, once per platform.
            - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
            - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
            - id: build
              uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
              with:
                  context: .
                  file: Dockerfile
                  push: true
                  platforms: linux/amd64,linux/arm64
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
                  tags: |
                      ghcr.io/${{ github.repository }}:${{ github.ref_name }}
                      ghcr.io/${{ github.repository }}:latest
            - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
              with:
                  subject-name: ghcr.io/${{ github.repository }}
                  subject-digest: ${{ steps.build.outputs.digest }}
                  push-to-registry: true
