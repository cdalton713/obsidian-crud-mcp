name: Set up repository tools
description: Install the proto, Node, and pnpm versions pinned in the repository.
runs:
    using: composite
    steps:
        - name: Read tool versions
          id: versions
          shell: bash
          run: |
              python3 - <<'PY'
              import json
              import os
              import tomllib

              with open(".prototools", "rb") as file:
                  tools = tomllib.load(file)
              with open("package.json") as file:
                  package = json.load(file)
              if package["packageManager"] != f"pnpm@{tools['pnpm']}":
                  raise SystemExit("The pnpm versions in .prototools and package.json must match")
              with open(os.environ["GITHUB_OUTPUT"], "a") as file:
                  print(f"proto={tools['proto']}", file=file)
              PY
        - uses: moonrepo/setup-toolchain@261c62cb5b0f580c7be7c8cd0f023a2e96756095 # v0.6.4
          with:
              proto-version: ${{ steps.versions.outputs.proto }}
              auto-install: true
